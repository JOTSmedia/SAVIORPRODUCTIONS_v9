<script>if(new URLSearchParams(location.search).get('loading')==='1')document.documentElement.classList.add('loading-mode');</script>

<style>
@font-face{font-family:Manrope;src:url('../fonts/manrope-400.woff2') format('woff2');font-weight:400;font-display:swap}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#ffffff;color:#171717;font-family:Manrope,Arial,sans-serif;text-transform:uppercase}body{min-height:300px}#preview-model{position:absolute;inset:0 0 54px;touch-action:none;outline-offset:-6px}#preview-model canvas{display:block;width:100%;height:100%}.preview-controls{position:absolute;bottom:14px;left:22px;right:22px;display:flex;align-items:center;justify-content:space-between;gap:14px}p{margin:0;font-size:13px;line-height:1.5;color:#555555}.actions{display:flex;gap:8px}button{font:inherit;text-transform:uppercase;font-size:12px;min-height:42px;padding:9px 13px;background:#c51d2b;color:#ffffff;border:0;cursor:pointer;transition:background .2s,transform .2s}button:hover{background:#a41120;transform:translateY(-2px)}button:focus-visible,#preview-model:focus-visible{outline:3px solid #c51d2b;outline-offset:3px}button[aria-pressed=true]{color:#ffffff;background:#c51d2b}.loader{position:absolute;inset:0;display:grid;place-items:center;font-size:14px;color:#c51d2b}.fallback-photo{display:block;width:100%;height:100%;object-fit:contain;border:3px solid #fff;border-radius:16px;transition:box-shadow .25s}.fallback-photo:hover{box-shadow:0 0 22px 8px #fff}.error-note{position:absolute;bottom:65px;left:22px;right:22px;font-size:12px}::selection{background:#c51d2b;color:#ffffff}@media(max-width:420px){.preview-controls{left:14px;right:14px;gap:8px}.actions{gap:5px}button{padding:9px 10px}p{font-size:11px;max-width:105px}}
@media(prefers-reduced-motion:reduce){button{transition:none}button:hover{transform:none}}
p{text-align:justify;text-justify:inter-word;text-align-last:left}
.loading-mode,.loading-mode body{background:transparent;min-height:0}.loading-mode #preview-model{inset:0;pointer-events:none;touch-action:auto;outline:none}.loading-mode .preview-controls,.loading-mode .loader,.loading-mode .error-note{display:none}.loading-mode .fallback-photo{border:0;border-radius:0;box-shadow:none}.loading-mode .eos-css-shutter-hit{pointer-events:none}
</style>
